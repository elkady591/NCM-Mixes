<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9631e">
<meta name="robots" content="noindex">
<title>NCM Mixes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f2ee; --card:#ffffff; --ink:#1c1c1a; --muted:#6c6b66; --line:#e2e0d8;
  --chip:#e9e7df; --accent:#d9631e; --accent-ink:#ffffff; --hl:#fff6ef;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131312; --card:#1e1e1c; --ink:#f1f0ea; --muted:#a19f97; --line:#34332f;
    --chip:#2a2a27; --accent:#f08a4b; --accent-ink:#1a1009; --hl:#2a201a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 "Segoe UI",Tahoma,system-ui,-apple-system,Roboto,"Noto Sans Arabic",sans-serif;
  -webkit-tap-highlight-color:transparent;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.title h1{font-size:19px;margin:0;direction:ltr}
.title small{color:var(--muted);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:10px;padding:0}
.gear:active{background:var(--chip)}
.lock{background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:16px;margin-top:14px}
.lock h3{margin:0 0 4px;font-size:16px}
.lock p{margin:0 0 10px;color:var(--muted);font-size:13px}
.lock form{display:flex;gap:8px}
.lock input{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);outline:none;direction:ltr}
.lock input:focus{border-color:var(--accent)}
.lock .btn{flex:none;padding:10px 18px}
.err{color:#d32f2f;font-size:13px;margin-top:6px}
.set h2{font-size:20px;margin:4px 0 12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:15px}
.box p{margin:0 0 12px;color:var(--muted);font-size:13px}
.box .btn{width:100%}
.box .btn + .btn{margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.kv span{color:var(--muted)}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;font:inherit;font-size:20px;padding:10px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none;direction:ltr;text-align:right}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{direction:rtl;color:var(--muted);font-size:16px}
.kbd{flex:none;width:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink)}

/* list */
.sec{font-size:13px;color:var(--muted);margin:14px 2px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 8px;text-align:center}
.tile b{display:block;font-size:22px;letter-spacing:.5px}
.tile .cls{display:inline-block;margin-top:2px;font-size:13px;font-weight:700;color:var(--accent)}
.tile .sub{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.tile.best{border-color:var(--accent);background:var(--hl)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.welcome{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;margin-top:24px;text-align:center}
.welcome h2{margin:0 0 8px;font-size:20px}
.welcome p{margin:0 0 16px;color:var(--muted);font-size:14px}

/* detail */
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:12px 0 4px;font-size:15px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.head h2{margin:0;font-size:30px}
.head h2 small{font-size:15px;color:var(--muted);font-weight:400}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 10px;font-weight:800;font-size:18px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.fact span{display:block;font-size:11px;color:var(--muted)}
.fact b{font-size:15px}
.fact.wide{grid-column:1/-1}

.qty{background:var(--card);border:1.5px solid var(--accent);border-radius:14px;padding:10px;margin-bottom:12px}
.qrow{display:flex;align-items:center;gap:8px}
.qrow label{font-weight:700;white-space:nowrap}
.qrow input{flex:1;min-width:0;font:inherit;font-size:26px;font-weight:700;text-align:center;padding:6px;
  border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.qrow input:focus{border-color:var(--accent)}
.step{width:48px;height:48px;border-radius:10px;border:0;background:var(--chip);font-size:24px;font-weight:700}

table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--chip)}
td.v,th.v{text-align:left;white-space:nowrap}
td .en{display:block;font-size:11px;color:var(--muted)}
td.tot{font-weight:800;font-size:17px}
td .t{display:block;font-size:12px;font-weight:600;color:var(--accent)}
tr.adm td{background:var(--hl)}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:12px;padding:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--chip);color:var(--ink)}
.rvg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rv{border:1.5px solid var(--line);border-radius:10px;padding:6px;background:var(--bg)}
.rv:first-child{grid-column:1/-1}
.rv span{display:block;font-size:11px;color:var(--muted);direction:ltr;text-align:left}
.rv img{display:block;max-width:100%;height:30px;object-fit:contain;object-position:left;background:#fff;border-radius:4px;margin:3px 0}
.rv input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:5px 8px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);direction:ltr}
.rv.bad{border-color:#d32f2f;background:rgba(211,47,47,.1)}
details.box summary{font-weight:700;cursor:pointer}
details.box[open] summary{margin-bottom:8px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:10px}
.tab{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.tab.on{background:var(--card);color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;
  max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="title"><h1>NCM Mixes</h1><small id="built"></small>
    <button class="gear" id="gearBtn" aria-label="الإعدادات"><svg viewBox="0 0 24 24" width="22" height="22" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
  <div class="search" id="searchBox">
    <input id="q" type="search" inputmode="numeric" autocomplete="off" placeholder="رقم الخلطة… 011 / 085 / 2018">
    <button class="kbd" id="kbd" title="تبديل الكيبورد">ABC</button>
  </div>
  <div class="chips" id="cls"></div>
</div></div>

<div class="wrap">
  <main id="list"></main>
  <main id="detail" class="hidden"></main>
</div>
<input type="file" id="file" class="hidden"
  accept=".xlsx,.xlsm,.xls,.pdf,image/*,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const CYR = {'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','Х':'X'};
const norm = s => String(s ?? '')
  .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660)
  .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x6F0)
  .toUpperCase().replace(/[АВЕКМНОРСТХ]/g, c => CYR[c]).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem('ncmmix.' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('ncmmix.' + k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
const fmt = (v, dec) => v == null ? '—' : Number(v).toLocaleString('en-US', {maximumFractionDigits: dec, minimumFractionDigits: 0});
const kg = v => fmt(v, v >= 100 ? 0 : 1);

function arName(en){
  const size = (en.match(/\(([^)]+)\)/) || [])[1];
  const sz = size ? ' <span class="num">' + esc(size.replace(/\s*mm/i, '')) + '</span>' : '';
  if (/cement/i.test(en)) return /lll|iii/i.test(en) ? 'أسمنت CEM III/A' : 'أسمنت CEM I SR3';
  if (/serpentin/i.test(en)) return (/sand/i.test(en) ? 'رمل سربنتين' : 'سن سربنتين') + sz;
  if (/sand/i.test(en)) return 'رمل' + sz;
  if (/crushed stone/i.test(en)) return 'سن' + sz;
  if (/magnetite/i.test(en)) return 'مجنتيت' + sz;
  if (/steel shot/i.test(en)) return 'بلي حديد ' + esc(en.replace(/steel shot/i, '').trim());
  if (/total water/i.test(en)) return 'مياه كلية';
  if (/free water/i.test(en)) return 'مياه حرة';
  if (/water/i.test(en)) return 'مياه';
  if (/^agg/i.test(en)) return 'سن <span class="num">' + esc(en.replace(/^agg\.?,?\s*/i, '')) + '</span>';
  return esc(en);
}

/* ---------- Excel import (data lives only on this phone) ---------- */
const txt = v => v == null ? '' : String(v).trim();
const num = v => {
  if (typeof v === 'number') return v;
  const s = txt(v).replace(',', '.');
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null;
};
function parseSheet(ws){
  if (!ws || !ws['!ref']) return [];
  const R = XLSX.utils.decode_range(ws['!ref']);
  const cell = (r, c) => { const x = ws[XLSX.utils.encode_cell({ r, c })]; return x ? x.v : null; };
  // Find the label column + the "Selection Card No." row
  let lc = -1, rCard = -1;
  for (let r = R.s.r; r <= R.e.r && lc < 0; r++)
    for (let c = R.s.c; c <= Math.min(R.e.c, R.s.c + 5); c++)
      if (/^Selection Card/i.test(txt(cell(r, c)))) { lc = c; rCard = r; break; }
  if (lc < 0) return [];
  const labels = [];
  for (let r = R.s.r; r <= R.e.r; r++) { const t = txt(cell(r, lc)); if (t) labels.push([r, t]); }
  const rowOf = re => { const x = labels.find(([, t]) => re.test(t)); return x ? x[0] : -1; };
  const rCls = rowOf(/^Strength Class/i), rMin = rowOf(/^Min\.? required/i), rSlump = rowOf(/^Slump/i),
        rWres = rowOf(/^Water Resistance/i), rExp = rowOf(/^Exposure/i), rWb = rowOf(/^W\/Binder/i),
        rAdm1 = rowOf(/^Admixture 1/i), rAdm2 = rowOf(/^Admixture 2/i), rDen = rowOf(/^Density/i),
        r7 = rowOf(/^Average 7/i), r28 = rowOf(/^Average 28/i), r56 = rowOf(/^Average 56/i);
  if (rWb < 0 || rAdm1 < 0) throw new Error('شكل الملف مختلف عن كتالوج الخلطات');
  const matRows = labels.filter(([r]) => r > rWb && r < rAdm1);
  // A card number merged over several columns belongs to each of them
  const origin = {};
  (ws['!merges'] || []).forEach(m => {
    if (m.s.r <= rCard && m.e.r >= rCard) for (let c = m.s.c; c <= m.e.c; c++) origin[c] = m.s.c;
  });
  const at = (r, c) => r < 0 ? null : cell(r, c);
  const mixes = [];
  for (let c = lc + 1; c <= R.e.c; c++) {
    const mats = matRows.map(([r, n]) => ({ n, v: num(cell(r, c)) })).filter(x => x.v);
    if (!mats.length) continue;
    const adm = [];
    [rAdm1, rAdm2].forEach(r => {
      if (r < 0) return;
      const b = txt(cell(r, c)), v = num(cell(r + 1, c));
      if (b || v) adm.push({ b, v });
    });
    mixes.push({
      card: txt(cell(rCard, origin[c] ?? c)) || ('عمود ' + XLSX.utils.encode_col(c)),
      cls: txt(at(rCls, c)), minSt: num(at(rMin, c)), slump: txt(at(rSlump, c)), wres: txt(at(rWres, c)),
      exp: txt(at(rExp, c)), wb: num(at(rWb, c)), mats, adm,
      dens: num(at(rDen, c)), s7: num(at(r7, c)), s28: num(at(r28, c)), s56: num(at(r56, c))
    });
  }
  return mixes;
}
// One spelling per Regular column, however the Excel or the scanned PDF wrote it
function regHead(v){
  const t = txt(v).replace(/\s+/g, ' ');
  if (/cement\s*type/i.test(t)) return 'Cement type';
  if (/cement/i.test(t)) return 'Cement, kg';
  if (/sand/i.test(t)) return 'Sand, kg';
  if (/agg.*20\s*mm/i.test(t)) return 'Agg 1.5 (20mm), kg';
  if (/agg.*10\s*mm/i.test(t)) return 'Agg 1 (10mm), kg';
  if (/total\s*water/i.test(t)) return 'Total Water, kg';
  if (/free\s*water/i.test(t)) return 'Free Water, kg';
  if (/w\s*\/\s*c/i.test(t)) return 'W/C';
  if (/add.*type/i.test(t)) return 'Add-Type G';
  if (/date/i.test(t)) return 'Date of trial';
  if (/28.{0,3}day/i.test(t)) return '28-days test result';
  if (/7.{0,3}day/i.test(t)) return '7-days test result';
  return t;
}
// "B25 /C30 C300350 SRC Screed" (a scan loses the underscores) → "B25 / C30_C300350 SRC_Screed"
function regClass(v){
  const p = txt(v).match(/(B[\d.]+)\s*\/\s*(C\d+)[\s_]*C(\d{6})[\s_]*(.*)$/i);
  if (!p) return txt(v);
  // (?![a-z]) keeps the "Scr" of "Screed" from reading as SRC
  return `${p[1].toUpperCase()} / ${p[2].toUpperCase()}_C${p[3]} ${/S[RC]{2}(?![a-z])/i.test(p[4]) ? 'SRC' : 'CEM I'}${/screed/i.test(p[4]) ? '_Screed' : ''}`;
}
// Regular catalog: one row per mix under a header row whose first cell is "Class"
function parseRegular(ws){
  if (!ws || !ws['!ref']) return [];
  const R = XLSX.utils.decode_range(ws['!ref']);
  const cell = (r, c) => { const x = ws[XLSX.utils.encode_cell({ r, c })]; return x ? x.v : null; };
  const shown = (r, c) => { const x = ws[XLSX.utils.encode_cell({ r, c })]; return x ? txt(x.w ?? x.v) : ''; };
  let hr = -1, c0 = -1;
  for (let r = R.s.r; r <= Math.min(R.e.r, R.s.r + 40) && hr < 0; r++)
    for (let c = R.s.c; c <= Math.min(R.e.c, R.s.c + 5); c++)
      if (/^Class$/i.test(txt(cell(r, c)))) { hr = r; c0 = c; break; }
  if (hr < 0) return [];
  const head = [];
  for (let c = c0 + 1; c <= R.e.c; c++) { const t = regHead(cell(hr, c)); if (t) head.push([c, t]); }
  const colOf = re => { const x = head.find(([, t]) => re.test(t)); return x ? x[0] : -1; };
  const cType = colOf(/^Cement type/i), cWc = colOf(/^W\/C/i), cAdd = colOf(/^Add/i), cDate = colOf(/^Date/i),
        c7 = colOf(/^7/), c28 = colOf(/^28/);
  const matCols = head.filter(([, t]) => /kg\s*$/i.test(t));
  if (!matCols.length) throw new Error('عناوين أعمدة الخامات مش مقروءة (لازم تنتهي بـ kg)');
  const at = (r, c) => c < 0 ? null : cell(r, c);
  const mixes = [];
  for (let r = hr + 1; r <= R.e.r; r++) {
    const name = regClass(cell(r, c0));
    if (!name) continue;
    const mats = matCols.map(([c, t]) => ({ n: t.replace(/,?\s*kg\s*$/i, ''), v: num(cell(r, c)) })).filter(x => x.v);
    if (!mats.length) continue;
    const adm = [], a = num(at(r, cAdd));
    if (a) adm.push({ b: head.find(([c]) => c === cAdd)[1], v: a });
    mixes.push({ name, ctype: txt(at(r, cType)), wc: num(at(r, cWc)), mats, adm,
                 date: cDate < 0 ? '' : shown(r, cDate), s7: num(at(r, c7)), s28: num(at(r, c28)) });
  }
  return mixes;
}
function loadXLSX(){
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = 'xlsx.full.min.js'; s.onload = ok; s.onerror = () => fail(new Error('مكتبة الإكسيل ما اتحملتش'));
    document.head.appendChild(s);
  });
}
function diff(oldM, newM){
  const keyed = list => { const seen = {}, out = {};
    list.forEach(m => { const id = m.card || m.name, n = seen[id] = (seen[id] || 0) + 1; out[id + '#' + n] = JSON.stringify(m); });
    return out; };
  const a = keyed(oldM), b = keyed(newM);
  let added = 0, changed = 0, removed = 0;
  for (const k in b) if (!(k in a)) added++; else if (a[k] !== b[k]) changed++;
  for (const k in a) if (!(k in b)) removed++;
  return { added, changed, removed };
}
async function importBuffer(buf, name){
  await loadXLSX();
  const wb = XLSX.read(buf, { type: 'array' });
  importSheets(wb.SheetNames.map(sn => wb.Sheets[sn]), name, 'excel');
}
function importSheets(sheets, name, src){
  // The file's layout tells which catalog it is
  let mixes = [], kind = '';
  for (const ws of sheets) {
    if ((mixes = parseSheet(ws)).length) { kind = 'nuclear'; break; }
    if ((mixes = parseRegular(ws)).length) { kind = 'regular'; break; }
  }
  if (!kind) throw new Error('مفيش خلطات في الملف ده');
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const set = { src, file: name, at: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, mixes };
  const ch = diff(DATA && DATA[kind] ? DATA[kind].mixes : [], mixes);
  saveData({ ...(DATA || {}), ver: d.toISOString(), [kind]: set });
  tab = kind; store.set('tab', tab); applyTab();
  go('');
  const label = `${KIND[kind]} — ${mixes.length} خلطة`;

let BUNDLE = null, needPwd = false, pwdErr = '';
async function decryptBundle(b, pwd){

  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: b64(b.salt), iterations: b.iter, hash: 'SHA-256' }, base, 512));
  const iv = b64(b.iv), ct = b64(b.ct), signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  const macKey = await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  if (!await crypto.subtle.verify('HMAC', macKey, b64(b.mac), signed)) throw new Error('pwd');
  const aesKey = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  const data = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, aesKey, ct)));
  const set = d => d && { ...d, src: 'bundle' };
  // v1 bundles held only the nuclear catalog at the top level
  return data.mixes ? { ver: b.ver, nuclear: set({ file: data.file, at: data.at, mixes: data.mixes }) }

}

}

async function unlock(pwd, asked){

/* ---------- PDF / picture import: find the table lines, read every cell on its own, then the user checks ---------- */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
const loadScript = src => new Promise((ok, fail) => {
  const s = document.createElement('script');

async function pdfPages(buf){

    const page = await pdf.getPage(n), base = page.getViewport({ scale: 1 });

    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);

}
async function pictureCanvas(blob){

  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);

}
// Table lines = long dark runs. Returns the row and column borders of the biggest evenly-spaced table.
function findGrid(canvas){

    hits.forEach(h => { const g = out[out.length - 1];

    return out.map(g => ({ p: (g.a + g.b) >> 1, x0: g.x0, x1: g.x1 })); };
  const minH = Math.max(60, W * 0.03), hits = [];
  for (let y = 0; y < H; y++) {
    let run = 0, sum = 0, x0 = W, x1 = 0;
    for (let x = 0; x <= W; x++) {
      if (x < W && dark[y * W + x]) run++;
      else { if (run >= minH) { sum += run; x0 = Math.min(x0, x - run); x1 = Math.max(x1, x); } run = 0; }
    }
    if (sum > W * 0.2) hits.push({ p: y, x0, x1 });
  }
  const lines = group(hits, 4);
  // Body = the longest run of evenly spaced lines
  let best = null;
  for (let i = 0; i < lines.length - 1; i++) {
    const g0 = lines[i + 1].p - lines[i].p;
    if (g0 < 12 || g0 > H * 0.08) continue;
    let j = i + 1;
    while (j + 1 < lines.length && Math.abs(lines[j + 1].p - lines[j].p - g0) <= g0 * 0.3) j++;
    if (j - i >= 3 && (!best || j - i > best.j - best.i)) best = { i, j, rowH: g0 };
  }

  let body = lines.slice(best.i, best.j + 1);
  // Faint lines are found in pieces and other marks share their rows, so the table edge is where most lines agree
  const agree = (vals, pick) => {
    const votes = vals.map(v => vals.filter(u => Math.abs(u - v) <= 8).length), top = Math.max(...votes);
    return pick(...vals.filter((v, i) => votes[i] === top));

  const x0 = agree(body.map(l => l.x0), Math.min), x1 = agree(body.map(l => l.x1), Math.max);
  // A taller header row sits right above the body
  // (a line that spans only some columns splits the header in two and is skipped)
  let top = null;
  for (let k = best.i - 1; k >= 0 && body[0].p - lines[k].p < best.rowH * 8; k--)
    if (Math.min(x1, lines[k].x1) - Math.max(x0, lines[k].x0) > (x1 - x0) * 0.8) top = lines[k];

    }
    if (sum > (yB - yA) * 0.15) vh.push({ p: x, x0: 0, x1: 0 });
  }
  const xs = group(vh, 4).map(l => l.p);
  // The outer border is often the faintest line: the table still starts and ends where its rows do
  if (xs.length && xs[0] - x0 > best.rowH) xs.unshift(x0);
  if (xs.length && x1 - xs[xs.length - 1] > best.rowH) xs.push(x1);

}
function cellCanvas(src, x, y, w, h, k = 1){
  const pad = 14, c = document.createElement('canvas');
  c.width = Math.round(w * k) + pad * 2; c.height = Math.round(h * k) + pad * 2;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, x, y, w, h, pad, pad, c.width - pad * 2, c.height - pad * 2);

let REVIEW = null;
async function importScan(file){
  const isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);
  let canvas = null, grid = null;
  if (isPdf) {
    const doc = await pdfPages(await file.arrayBuffer());
    for (let n = 1; n <= doc.count && !grid; n++) { canvas = await doc.page(n); grid = findGrid(canvas); }
  } else { canvas = await pictureCanvas(file); grid = findGrid(canvas); }
  if (!grid) throw new Error('مقدرتش ألاقي جدول بخطوط واضحة في الملف');
  const R = grid.ys.length - 1, C = grid.xs.length - 1;
  if (R * C > 500) throw new Error('الجدول كبير قوي على القراءة من صورة — استخدم ملف Excel');
  if (!window.Tesseract) await loadScript(TESS);
  const worker = await Tesseract.createWorker('eng');
  const inset = Math.max(3, Math.round(grid.rowH * 0.14));

    const x = grid.xs[c] + inset, y = grid.ys[r] + inset, w = grid.xs[c + 1] - inset - x, h = grid.ys[r + 1] - inset - y;
    const cc = cellCanvas(canvas, x, y, w, h);

    const d = (await worker.recognize(cc)).data, out = { v: clean(d), conf: d.confidence, img: cc.toDataURL('image/png') };

    return out;

    const rows = [];

      const row = [];
      for (let c = 0; c < C; c++) {
        toast(`بيقرا الجدول… ${Math.round((r * C + c) * 100 / (R * C))}%`, 20000);
        const head = r === 0, name = head ? '' : regHead(rows[0][c].v);
        row.push(await read(r, c, !head && c > 0 && !/type$|^date|^class$/i.test(name), head));

      // A lost decimal point: offer the value that fits the column, but keep it marked for checking

// Which read values look wrong and must be compared with the picture
function suspect(head, x, row, heads){
  if (x.ok) return false;          // the user tapped the picture: checked
  if (x.guess) return true;
  const v = x.v, n = /^-?\d+(\.\d+)?$/.test(v) ? parseFloat(v) : NaN;
  const within = (a, b) => !isNaN(n) && n >= a && n <= b;
  if (/^class$/i.test(head)) {
    // The name must be complete, and it repeats the strength (C30 → C300) and the cement content
    const p = v.match(/^B[\d.]+ \/ C(\d+)_C(\d{3})(\d{3}) (CEM I|SRC)(_Screed)?$/), ci = heads.findIndex(h => /^cement,/i.test(h));
    return !p || +p[2] !== +p[1] * 10 || (ci >= 0 && parseFloat(row[ci].v) !== +p[3]);
  }
  if (/type$/i.test(head)) return !/^(OPC|SRC|SCR)$/i.test(v);
  if (/^date/i.test(head)) return !/^\d{1,2}-[A-Za-z]{3}-\d{2,4}$/.test(v);
  if (x.conf < 80) return true;

  if (/kg$/i.test(head)) return v === '' || /^-+$/.test(v) ? false : !within(100, 2000);
  if (/^w\/c/i.test(head)) {
    const get = re => { const i = heads.findIndex(h => re.test(h)); return i < 0 ? NaN : parseFloat(row[i].v); };
    const calc = get(/^free water/i) / get(/^cement,/i);

}

function nuclearMix(m, i){
  const card = String(m.card).trim();
  const short = card.includes('/') ? card.split('/').slice(0, 2).join('/') : card.split('-')[0];
  const cls = norm(m.cls);
  return { ...m, kind: 'nuclear', i, card, short, rest: card.slice(short.length), cls, slump: norm(m.slump),

}
// "B25 / C30_C300350 SRC_Screed" → B25 · C30 · strength 300 · cement 350 · "SRC Screed"
function regularMix(m, i){
  const name = String(m.name).trim();
  const p = norm(name).match(/^(B[\d.]+)\s*\/\s*(C\d+)\s*_?\s*C(\d{3})(\d{3})\s*(.*)$/);
  const short = p ? p[1] : norm(name).split(/[\s\/]/)[0];
  const tag = (p ? p[5] : '').replace(/_/g, ' ').trim();
  const ctype = /^S[CR]{2}$/i.test(m.ctype) ? 'SRC' : norm(m.ctype);
  return { ...m, kind: 'regular', i, name, short, cls: short, c: p ? p[2] : '', st: p ? p[3] : '', cem: p ? p[4] : '',
           tag, ctype, num: parseFloat(short.slice(1)), find: norm(name).replace(/\s+/g, ''), key: 'R|' + name,
           // Water is batched from Total Water, so Free Water is not listed
           mats: m.mats.filter(x => !/free water/i.test(x.n)).map(x =>
             /^cement/i.test(x.n) ? { ...x, ar: 'أسمنت ' + esc(ctype) } : /total water/i.test(x.n) ? { ...x, ar: 'مياه' } : x) };
}
function setData(d){
  // Data saved by the first version held only the nuclear catalog at the top level
  if (d && d.mixes) d = { ver: d.ver, nuclear: { src: d.src, file: d.file, at: d.at, mixes: d.mixes } };
  DATA = d;
  MIX = [...(d && d.nuclear ? d.nuclear.mixes.map(nuclearMix) : []), ...(d && d.regular ? d.regular.mixes.map(regularMix) : [])];
  const count = {};
  MIX.forEach(m => { if (m.card) count[m.card] = (count[m.card] || 0) + 1; });
  MIX.forEach(m => m.multi = count[m.card] > 1);
  document.getElementById('searchBox').classList.toggle('hidden', !d);
  applyTab();
}
function applyTab(){
  const list = MIX.filter(m => m.kind === tab);
  SORTED = tab === 'regular' ? list.sort((a, b) => (a.num - b.num) || (a.i - b.i))
    : list.sort((a, b) => (a.card.includes('/') - b.card.includes('/')) || (a.num - b.num) || (a.i - b.i));
  CLASSES = [...new Set(SORTED.map(m => m.cls))].sort((a, b) =>
    a[0].localeCompare(b[0]) || parseFloat(a.slice(1)) - parseFloat(b.slice(1)));
  if (!CLASSES.includes(clsFilter)) clsFilter = '';
  document.getElementById('built').textContent = DATA ? `${SORTED.length} خلطة` : '';
  qEl.placeholder = tab === 'regular' ? 'الرتبة… 25 / 300 / B25' : 'رقم الخلطة… 011 / 085 / 2018';
  renderChips();
}
const byKey = k => MIX.find(m => m.key === k);

/* keyboard toggle (numbers / letters) */
const kbdBtn = document.getElementById('kbd');
function setKbd(mode){
  qEl.setAttribute('inputmode', mode);
  kbdBtn.textContent = mode === 'numeric' ? 'ABC' : '123';
  store.set('kbd', mode);
}
setKbd(store.get('kbd', 'numeric'));
kbdBtn.onclick = () => { setKbd(qEl.getAttribute('inputmode') === 'numeric' ? 'text' : 'numeric'); qEl.blur(); qEl.focus(); };

/* class chips */
const clsEl = document.getElementById('cls');
function renderChips(){
  clsEl.innerHTML = SORTED.length ? ['', ...CLASSES].map(c =>
    `<button class="chip${c === clsFilter ? ' on' : ''}" data-c="${esc(c)}">${c || 'الكل'}</button>`).join('') : '';
}
clsEl.onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  clsFilter = b.dataset.c; renderChips(); go('');
};

/* ---------- search ---------- */
function results(){
  const q = norm(qEl.value).replace(/\s+/g, '');
  let list = clsFilter ? SORTED.filter(m => m.cls === clsFilter) : SORTED;
  if (!q) return { list, best: null };
  const reg = tab === 'regular';
  if (/^[A-Z]/.test(q)) return { best: null, list: list.filter(m =>
    reg ? m.find.includes(q) : m.cls.startsWith(q) || m.slump.startsWith(q)) };
  const qn = /^\d+(\.\d+)?$/.test(q) ? parseFloat(q) : NaN;
  const scored = list.map(m => {
    let s = 0;
    if (reg) {
      // 25 → B25 first, then the mixes with strength or cement content 25x, then anything containing it
      if (m.num === qn) s = 3;
      else if (m.st === q || m.cem === q) s = 2;
      else if (q.length >= 3 && m.find.includes(q)) s = 1;
    }
    else if (m.num === qn || m.short === q) s = 3;
    else if (m.short.startsWith(q)) s = 2;
    else if (m.card.replace(/\s+/g, '').replace(/-20-20\d\d$/, '').includes(q)) s = 1;
    return [s, m];
  }).filter(x => x[0]).sort((a, b) => b[0] - a[0]);
  const top = scored.filter(x => x[0] === 3);
  return { list: scored.map(x => x[1]), best: top.length === 1 ? top[0][1] : null };
}

function tile(m, best){
  const [mid, sub] = m.kind === 'regular'
    ? [[m.c, m.cem].filter(Boolean).join(' · '), [m.ctype === 'OPC' ? 'CEM I' : m.ctype, /screed/i.test(m.tag) ? 'Screed' : ''].filter(Boolean).join(' · ')]
    : [m.cls, m.multi ? 'W/B ' + fmt(m.wb, 2) : m.slump];
  return `<button class="tile${best ? ' best' : ''}" data-k="${esc(m.key)}">
    <b class="num">${esc(m.short)}</b><span class="cls num">${esc(mid)}</span><span class="sub num">${esc(sub)}</span></button>`;
}
function tabsHtml(){
  return `<div class="tabs">${Object.keys(KIND).map(k =>
    `<button class="tab${k === tab ? ' on' : ''}" data-tab="${k}">${KIND[k]} Concrete</button>`).join('')}</div>`;
}

const listEl = document.getElementById('list'), detEl = document.getElementById('detail');
function renderList(){
  if (!DATA) {
    listEl.innerHTML = needPwd ? lockCard() : BUNDLE === null && loading ? '<div class="empty">بيحمّل…</div>' :
      `<div class="welcome"><h2>أهلاً</h2>
      <p>مقدرتش أجيب الخلطات — اتأكد إن النت شغال وافتح تاني،<br>أو اختار ملف الإكسيل من الموبايل.</p>
      <button class="btn" id="impFirst">اختيار ملف Excel</button></div>`;
    return;
  }
  const { list, best } = results();
  let h = needPwd ? lockCard() : '';
  h += `<div class="sec">كل الخلطات</div>${tabsHtml()}`;
  if (qEl.value || clsFilter) h += `<div class="sec">النتائج (${list.length})</div>`;
  h += list.length ? `<div class="grid">${list.map(m => tile(m, m === best)).join('')}</div>`
    : `<div class="empty">${SORTED.length ? 'مفيش خلطة بالرقم ده' : `مفيش خلطات ${KIND[tab]} لسه — اعمل Import من الإعدادات`}</div>`;
  listEl.innerHTML = h;
}
listEl.onclick = e => {
  if (e.target.id === 'impFirst') return fileEl.click();
  if (e.target.dataset.tab) {
    tab = e.target.dataset.tab; store.set('tab', tab);
    qEl.value = ''; clsFilter = '';
    applyTab(); renderList();
    return;
  }
  const t = e.target.closest('.tile'); if (t) go(t.dataset.k);
};
qEl.addEventListener('input', () => { if (location.hash) go(''); else renderList(); });
qEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault(); qEl.blur();
  const r = results(), m = r.best || r.list[0];
  if (m) go(m.key);
});

/* ---------- detail ---------- */
function rows(m){
  const f = Number(qty) || 0;
  const r = m.mats.map(x => ({ ar: x.ar || arName(x.n), en: x.n, v: x.v, adm: false }));
  // Liquid admixtures are catalogued in kg but dosed in litres: litres = kg ÷ density
  m.adm.forEach((a, i) => {
    const d = density(a.b);
    r.push({ ar: 'إضافة ' + (i + 1), en: a.b, adm: true, v: d && a.v != null ? a.v / d : a.v, kg: d ? a.v : null });
  });
  r.forEach(x => { x.t = x.v == null ? null : x.v * f; x.tkg = x.kg == null ? null : x.kg * f; });
  return r;
}
// kg per litre; an admixture not listed here stays in kg (Rheoplast CS-1)
function density(brand){
  if (/324[01]/.test(brand)) return 1.06;
  if (/type\s*g/i.test(brand)) return 1.215;
  return 0;
}
const lit = v => fmt(v, v >= 100 ? 1 : 2);
function renderDetail(m){
  const r = rows(m);
  const fact = (k, v, wide) => v == null || v === '' ? '' : `<div class="fact${wide ? ' wide' : ''}"><span>${k}</span><b class="num">${esc(v)}</b></div>`;
  const head = m.kind === 'regular' ? `
    <div class="head"><h2 class="num">${esc(m.short)}<small>${m.c ? ' / ' + esc(m.c) : ''}</small></h2>
      <span class="badge">${esc(m.ctype === 'OPC' ? 'CEM I' : m.ctype)}</span></div>
    <div class="facts">
      ${fact('Cement (kg)', m.cem)}${fact('W/C', m.wc == null ? null : fmt(m.wc, 2))}${fact('Cement type', m.ctype)}
      ${fact('Date of trial', m.date)}${fact('7 يوم', m.s7 == null ? null : fmt(m.s7, 2))}${fact('28 يوم', m.s28 == null ? null : fmt(m.s28, 2))}
      ${fact('Class', m.name, true)}
    </div>` : `
    <div class="head"><h2 class="num">${esc(m.short)}<small>${esc(m.rest)}</small></h2><span class="badge">${esc(m.cls)}</span></div>
    <div class="facts">
      ${fact('Slump / Flow', m.slump)}${fact('W/B', m.wb == null ? null : fmt(m.wb, 2))}${fact('Water Res.', m.wres)}
      ${fact('Density', m.dens == null ? null : fmt(m.dens, 0))}${fact('Min. St. (MPa)', m.minSt == null ? null : fmt(m.minSt, 1))}
      ${fact('28 يوم (MPa)', m.s28 == null ? null : fmt(m.s28, 1))}${fact('Exposure', m.exp && m.exp !== '-' ? m.exp : null, true)}
    </div>`;
  detEl.innerHTML = `
    <button class="back" id="back">→ كل الخلطات</button>${head}
    <div class="qty">
      <div class="qrow">
        <label for="qty">الكمية م³</label>
        <button class="step" data-d="-1">−</button>
        <input id="qty" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0" value="${esc(qty)}">
        <button class="step" data-d="1">+</button>
      </div>
    </div>
    <table>
      <thead><tr><th>الخامة</th><th class="v">للمتر (كجم)</th><th class="v">الإجمالي (كجم)</th></tr></thead>
      <tbody id="tb">${tbody(r)}</tbody>
    </table>
    <div class="actions"><button class="btn" id="share">مشاركة / نسخ</button><button class="btn ghost" id="back2">خلطة تانية</button></div>`;
}
function tbody(r){
  return r.map(x => x.kg != null ? `<tr class="adm"><td>${x.ar}<span class="en">${esc(x.en)}</span></td>
    <td class="v"><span class="num">${lit(x.v)}</span> لتر<span class="en"><span class="num">${kg(x.kg)}</span> كجم</span></td>
    <td class="v tot"><span class="num">${lit(x.t)}</span> لتر<span class="en"><span class="num">${kg(x.tkg)}</span> كجم</span></td></tr>`
    : `<tr class="${x.adm ? 'adm' : ''}"><td>${x.ar}<span class="en">${esc(x.en)}</span></td>
    <td class="v num">${kg(x.v)}</td>
    <td class="v num tot">${kg(x.t)}${x.t >= 1000 ? `<span class="t">${fmt(x.t / 1000, 2)} طن</span>` : ''}</td></tr>`).join('');
}
// Only the totals change while typing; redrawing the input would move the cursor on phones
function refreshTotals(){
  const m = current(), tb = document.getElementById('tb');
  if (m && tb) tb.innerHTML = tbody(rows(m));
}
detEl.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'back' || t.id === 'back2') { history.length > 1 && location.hash ? history.back() : go(''); return; }
  if (t.id === 'share') return share();
  if (t.id === 'setImport') return fileEl.click();
  if (t.id === 'setReset') { toast('بيرجع…', 10000); return syncBundle(true); }
  if (t.dataset.d) {
    qty = Math.max(0, (Number(qty) || 0) + Number(t.dataset.d));
    document.getElementById('qty').value = qty; refreshTotals();
  }
});
detEl.addEventListener('input', e => {
  if (e.target.id !== 'qty') return;
  qty = e.target.value;
  refreshTotals();
});
detEl.addEventListener('keydown', e => {
  if (e.target.id === 'qty' && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
});

function share(){
  const m = current(); if (!m) return;
  // English only: mixed Arabic/English lines get reordered in chat apps
  const en = x => x.adm ? x.en
    : /cement/i.test(x.en) ? 'Cement ' + (m.kind === 'regular' ? m.ctype : /lll|iii/i.test(x.en) ? 'CEM III/A' : 'CEM I SR3')
    : /total water/i.test(x.en) ? 'Water'
    : x.en.replace(/\(\s*/g, '(').replace(/\s*\)/g, ')').replace(/\s+/g, ' ').trim();
  // No quantity typed = send the mix design itself, per 1 m3
  const q = Number(qty) || 0, val = x => q ? x.t : x.v;
  const lines = [`Mix ${m.kind === 'regular' ? m.name : m.card + ' | ' + m.cls} | ${q ? q + ' m3' : 'per 1 m3'}`];
  rows(m).forEach(x => lines.push(`${en(x)}: ` + (x.kg != null ? `${lit(val(x))} L` : `${kg(val(x))} kg`)));
  const text = lines.join('\n');
  if (navigator.share) { navigator.share({ text }).catch(() => {}); return; }
  copy(text);
}
function copy(text){
  const done = () => toast('اتنسخ');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => legacy());
  else legacy();
  function legacy(){ const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch(e){} t.remove(); }
}
let toastTimer;
function toast(s, ms = 1600){
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  if (!s) { t.classList.remove('on'); return; }
  t.textContent = s; t.classList.add('on');
  toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}

/* ---------- routing (Android back button closes the mix) ---------- */
const current = () => byKey(decodeURIComponent(location.hash.slice(1)));
function go(key){
  if (key) location.hash = encodeURIComponent(key);
  else if (location.hash) history.replaceState(null, '', location.pathname + location.search), route();
  else route();
}
function renderSettings(){
  const info = k => {
    const d = DATA && DATA[k];
    return `<div class="box"><h3>${KIND[k]} Concrete</h3>${d ? `
      <div class="kv"><span>المصدر</span><b>${d.src === 'bundle' ? 'الخلطات الأساسية' : d.src === 'pdf' ? 'PDF من الموبايل' : 'ملف Excel من الموبايل'}</b></div>
      <div class="kv"><span>الملف</span><b class="num">${esc(d.file)}</b></div>
      <div class="kv"><span>التاريخ</span><b class="num">${esc(d.at)}</b></div>
      <div class="kv"><span>عدد الخلطات</span><b class="num">${d.mixes.length}</b></div>` : '<p>مفيش خلطات لسه.</p>'}</div>`;
  };
  const imported = DATA && Object.keys(KIND).some(k => DATA[k] && DATA[k].src !== 'bundle');
  detEl.innerHTML = `<div class="set">
    <button class="back" id="back">→ رجوع</button>
    <h2>الإعدادات</h2>
    ${info('nuclear')}${info('regular')}
    <div class="box"><h3>تحديث الخلطات من Excel أو PDF</h3>
      <p>اختار ملف الكتالوج الجديد (Nuclear أو Regular). التطبيق بيعرف نوعه لوحده وبيحدّث الخلطات بتاعته بس.<br>
        الـ PDF أو الصورة بيتقروا خانة خانة (محتاج نت)، وبعدها بتراجع الأرقام قبل الحفظ.</p>
      <button class="btn" id="setImport">Import ملف Excel / PDF</button>
      ${imported && BUNDLE ? '<button class="btn ghost" id="setReset">رجوع للخلطات الأساسية</button>' : ''}
    </div></div>`;
}
function route(){
  if (location.hash === '#review') {
    if (!REVIEW) return go('');
    renderReview();
    listEl.classList.add('hidden'); detEl.classList.remove('hidden');
    window.scrollTo(0, 0);
    return;
  }
  if (location.hash === '#settings') {
    renderSettings();
    listEl.classList.add('hidden'); detEl.classList.remove('hidden');
    return;
  }
  const m = current();
  if (m) {
    qty = '';  // every mix opens at 0 m³
    renderDetail(m);
    listEl.classList.add('hidden'); detEl.classList.remove('hidden');
    window.scrollTo(0, 0);
  } else {
    detEl.classList.add('hidden'); listEl.classList.remove('hidden');
    renderList();
  }
}
window.addEventListener('hashchange', route);
document.getElementById('gearBtn').onclick = () => { if (location.hash !== '#settings') location.hash = 'settings'; };
let loading = true;
wireReview();
setData(store.get('data', null));
route();
syncBundle().finally(() => { loading = false; if (!DATA) route(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
